apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'dev.longx.notify'
version = '0.1.0'

android {
  namespace "dev.longx.notify"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 26)
  }
  lintOptions {
    abortOnError false
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getKotlinVersion()}"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "androidx.core:core-ktx:1.16.0"
}

def getKotlinVersion() {
  rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "2.1.20"
}
