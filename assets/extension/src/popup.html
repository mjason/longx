<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Longx 浏览器桥</title>
  </head>
  <body>
    <header>
      <img src="/icons/icon-32.png" alt="" width="24" height="24" />
      <h1>Longx 浏览器桥</h1>
    </header>
    <form id="form">
      <label for="device-name">设备名称</label>
      <input id="device-name" type="text" maxlength="80" required autocomplete="off" placeholder="自动生成；可改为「桌面 Mac」" />
      <button id="save-name" type="button" class="secondary">保存名称</button>
      <p class="hint">此名称显示在 Longx 的接入请求和设备列表中，不是项目使用的别名。</p>
      <label for="server">Longx 地址</label>
      <input id="server" type="url" placeholder="http://192.168.2.70:7788" autocomplete="off" spellcheck="false" />
      <div class="row">
        <button id="connect" type="submit">连接</button>
        <button id="disconnect" type="button" class="secondary" hidden>断开</button>
      </div>
    </form>
    <p id="status" class="status" data-status="disconnected">未连接</p>
    <p id="identity" class="hint"></p>
    <p id="hint" class="hint" hidden></p>
    <section id="sessions" hidden>
      <h2>正在使用这个浏览器的会话</h2>
      <ul></ul>
    </section>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
