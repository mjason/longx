name: Release

# A tag `vX.Y.Z` builds the self-contained release (ERTS, the Go shim, the
# bundled codex-app-server, git and obscura, the built SPA) for linux x86_64
# and arm64 — each on a runner of its own architecture, no cross-compiling —
# and attaches the tarballs to the GitHub release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MIX_ENV: prod
  # config/runtime.exs (prod) insists on a data dir even for the mix tasks that
  # only fetch bundles — a scratch one for the build
  LONGX_DATA_DIR: /tmp/longx-build-data

jobs:
  build:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/shim/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Cache mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-prod-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-prod-${{ runner.os }}-${{ matrix.arch }}-

      - name: Cache bundled binaries
        uses: actions/cache@v4
        with:
          path: |
            priv/git
            priv/codex
            priv/obscura
          key: bundles-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('lib/longx/git/runtime.ex', 'lib/longx/codex/runtime.ex', 'lib/longx/browser/runtime.ex') }}

      - run: mix deps.get --only prod
      - run: npm ci --prefix assets

      # the bundles for the platform this runner is (the release runs on the same)
      - run: mix codex.fetch
      - run: mix git.fetch
      - run: mix obscura.fetch

      - run: mix assets.build
      - run: mix release --overwrite

      - name: Package
        id: package
        run: |
          version="$(mix run --no-start --no-compile -e 'IO.puts(Mix.Project.config()[:version])')"
          name="longx-${version}-linux-${{ matrix.arch }}"
          tar -C _build/prod/rel -czf "${name}.tar.gz" longx
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          generate_release_notes: true

  # the Android app, versioned like the server (app.config.js reads the tag),
  # signed with the repository's key (secrets; the debug key without them)
  android:
    name: android apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: mobile
      - name: Signing key
        if: ${{ env.RELEASE_KEYSTORE_B64 != '' }}
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LONGX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: mobile
        env:
          LONGX_VERSION: ${{ github.ref_name }}
          LONGX_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LONGX_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LONGX_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../../longx-android-${LONGX_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: longx-android-${{ github.ref_name }}
          path: longx-android-*.apk
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: longx-android-*.apk
          generate_release_notes: true
