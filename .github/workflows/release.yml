name: Release

# A tag `vX.Y.Z` builds the self-contained release (ERTS, the Go shim, the
# built SPA; the headless browser is downloaded on first use) for linux x86_64
# and arm64 — each on a runner of its own architecture, no cross-compiling —
# attaches the tarballs to the GitHub release for that tag, and builds the
# Docker image from each tarball (`Dockerfile`; native per arch, so no QEMU),
# pushed to ghcr.io/<repo>:<version>-<arch> and stitched into
# ghcr.io/<repo>:<version> + :latest (multi-arch) by the last job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  MIX_ENV: prod
  # config/runtime.exs (prod) insists on a data dir even for the build's mix
  # tasks — a scratch one
  LONGX_DATA_DIR: /tmp/longx-build-data

jobs:
  build:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/shim/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Cache mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-prod-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-prod-${{ runner.os }}-${{ matrix.arch }}-

      - run: mix deps.get --only prod
      - run: npm ci --prefix assets

      - run: mix assets.build
      # the cached _build must not hand an older version's lib/ to the tarball
      - run: rm -rf _build/prod/rel
      - run: mix release --overwrite

      - name: Package
        id: package
        run: |
          version="$(mix run --no-start --no-compile -e 'IO.puts(Mix.Project.config()[:version])')"
          name="longx-${version}-linux-${{ matrix.arch }}"
          tar -C _build/prod/rel -czf "${name}.tar.gz" longx
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          generate_release_notes: true

      # the Docker image of this architecture, from the tarball just built
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image (${{ matrix.arch }})
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg TARBALL="${{ steps.package.outputs.name }}.tar.gz" \
            -t "${image}:${version}-${{ matrix.arch }}" .
          docker push "${image}:${version}-${{ matrix.arch }}"

  image:
    name: multi-arch image
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch <version> and latest from the two architectures
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            -t "${image}:${version}" -t "${image}:latest" \
            "${image}:${version}-x86_64" "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"
