name: Release

# A tag `vX.Y.Z` builds the self-contained release (ERTS, the Go shim, the
# built SPA; the headless browser is downloaded on first use) for linux x86_64
# and arm64, plus macOS Apple Silicon — each on a native runner —
# attaches the tarballs to the GitHub release for that tag, and builds the
# Docker image from each tarball (`Dockerfile`; native per arch, so no QEMU),
# pushed to ghcr.io/<repo>:<version>-<arch> and stitched into
# ghcr.io/<repo>:<version> + :latest (multi-arch) by the last job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-tag to rebuild and publish (empty for artifacts only)
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  MIX_ENV: prod
  # config/runtime.exs (prod) insists on a data dir even for the build's mix
  # tasks — a scratch one
  LONGX_DATA_DIR: /tmp/longx-build-data
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: linux
            runner: ubuntu-24.04
          - arch: arm64
            os: linux
            runner: ubuntu-24.04-arm
          - arch: arm64
            os: darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Import Developer ID and notarization credentials
        if: matrix.os == 'darwin'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID TEAM_ID APPLE_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "Missing required secret: $value"; exit 1; }
          done
          keychain="$RUNNER_TEMP/longx-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          umask 077
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/longx-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/longx-signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials Longx-CI --keychain "$keychain" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD"
          rm "$RUNNER_TEMP/longx-signing.p12"


      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/shim/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Cache mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-prod-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-prod-${{ runner.os }}-${{ matrix.arch }}-

      - run: mix deps.get --only prod
      - run: npm ci --prefix assets

      - run: mix assets.build
      # the cached _build must not hand an older version's lib/ to the tarball
      - run: rm -rf _build/prod/rel
      - run: mix release --overwrite

      - name: Bundle native macOS libraries and relocate dependencies
        if: matrix.os == 'darwin'
        run: python3 scripts/bundle-macos.py _build/prod/rel/longx

      - name: Developer ID sign native macOS release
        if: matrix.os == 'darwin'
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: python3 scripts/sign-macos.py _build/prod/rel/longx --identity "$SIGNING_IDENTITY" --team "$TEAM_ID"

      - name: Notarize native macOS release
        if: matrix.os == 'darwin'
        run: |
          set -euo pipefail
          ditto -c -k --keepParent _build/prod/rel/longx "$RUNNER_TEMP/longx-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/longx-notarization.zip" --keychain-profile Longx-CI --keychain "$RUNNER_TEMP/longx-signing.keychain-db" --wait --output-format json > "$RUNNER_TEMP/notarization.json"
          python3 scripts/check-notarization.py "$RUNNER_TEMP/notarization.json"
          # Bare executables/tarballs cannot be stapled. Apple records their code hashes;
          # Gatekeeper can retrieve tickets online. Do not alter code after this point.

      - name: Remove macOS signing material
        if: always() && matrix.os == 'darwin'
        run: |
          security delete-keychain "$RUNNER_TEMP/longx-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/longx-signing.p12" "$RUNNER_TEMP/longx-notarization.zip"

      - name: Package
        id: package
        run: |
          version="$(mix run --no-start --no-compile -e 'IO.puts(Mix.Project.config()[:version])')"
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}" == true ]]; then
            [[ "$RELEASE_TAG" == "v$version" ]] || { echo "::error::Requested tag differs from source version"; exit 1; }
          fi
          name="longx-${version}-${{ matrix.os }}-${{ matrix.arch }}"
          tar -C _build/prod/rel -czf "${name}.tar.gz" longx
          if [ "${{ matrix.os }}" = darwin ]; then
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Native macOS installer and runtime smoke test
        if: matrix.os == 'darwin'
        timeout-minutes: 10
        run: |
          test "$(uname -m)" = arm64
          # The Linux controlling-terminal fixtures use Linux TIOCSCTTY and
          # belong to Linux CI, not the native macOS installer smoke test.
          python3 -B -m unittest discover -v -s test -p '*macos*_test.py'
          LONGX_HOME="$HOME/longx-smoke" python3 install-macos.py --no-service --tarball "${{ steps.package.outputs.name }}.tar.gz"
          env -i HOME="$HOME" PATH="/usr/bin:/bin:/usr/sbin:/sbin" LONGX_DATA_DIR="$HOME/longx-smoke/data" "$HOME/longx-smoke/app/bin/longx" eval ':crypto.strong_rand_bytes(32); {:ok, _} = Application.ensure_all_started(:longx); IO.puts("native runtime OK")'

      - name: Upload macOS installer
        if: matrix.os == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            install-macos.py
            install-macos.sh
          if-no-files-found: error

      - name: Attach macOS installer
        if: matrix.os == 'darwin' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            install-macos.py
            install-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          generate_release_notes: true

      # the Docker image of this architecture, from the tarball just built
      - name: Log in to GHCR
        if: matrix.os == 'linux' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image (${{ matrix.arch }})
        if: matrix.os == 'linux' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        run: |
          version="${RELEASE_TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg TARBALL="${{ steps.package.outputs.name }}.tar.gz" \
            -t "${image}:${version}-${{ matrix.arch }}" .
          docker push "${image}:${version}-${{ matrix.arch }}"

  image:
    name: multi-arch image
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch <version> and latest from the two architectures
        run: |
          version="${RELEASE_TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            -t "${image}:${version}" -t "${image}:latest" \
            "${image}:${version}-x86_64" "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"
