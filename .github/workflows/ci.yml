name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  computer:
    name: Computer bridge and release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: node apps/computer/scripts/release-artifacts.mjs version
      - run: npm --prefix apps/computer run test:release
      - run: cargo test --locked --manifest-path apps/computer/src-tauri/Cargo.toml --no-default-features --features test-fixture

  test:
    name: precommit (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/shim/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Cache mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: npm ci --prefix assets

      - run: python3 -B -m unittest discover -s test -p '*_test.py'
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      - run: test -z "$(gofmt -l .)"
        working-directory: native/shim
      - run: go vet ./...
        working-directory: native/shim
      - run: go test ./...
        working-directory: native/shim
      # the committed GraphQL schema and the client generated from it are current
      - run: mix schema.check
      - run: npm run present-schema --prefix assets -- --check
      - run: npm run check --prefix assets
      - name: Browser UI regressions
        working-directory: assets
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:scroll
          npm run test:scroll -- --webkit
          npm run test:clipboard
          npm run build
          npm run test:projects
      # the bwrap probe passes on a dev box, not inside a GitHub runner
      - run: mix test --exclude host_sandbox
