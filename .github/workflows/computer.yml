name: Longx Computer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/computer
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-aarch64
            bundles: dmg
          - runner: macos-15-intel
            target: darwin-x86_64
            bundles: dmg
          - runner: ubuntu-24.04
            target: linux-x86_64
            bundles: appimage,deb
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            bundles: appimage,deb
          - runner: windows-latest
            target: windows-x86_64
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/computer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libdbus-1-dev
      - name: Verify release version and updater configuration
        id: config
        env:
          UPDATE_KEY: ${{ secrets.COMPUTER_UPDATER_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.COMPUTER_UPDATER_PUBLIC_KEY }}
        run: |
          node scripts/release-artifacts.mjs version
          if [[ -n "$UPDATE_KEY" && -n "$UPDATE_PUBLIC_KEY" ]]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$UPDATE_KEY" && -z "$UPDATE_PUBLIC_KEY" ]]; then
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Updater keys are not configured; installers will be built with self-update disabled."
          else
            echo "::error::Configure both COMPUTER_UPDATER_PRIVATE_KEY secret and COMPUTER_UPDATER_PUBLIC_KEY variable."
            exit 1
          fi
      - run: npm ci
      - run: npm run prepare:driver
      - name: Test HTTP bridge
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features test-fixture
      - name: Import macOS release identity
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID TEAM_ID APPLE_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "::error::Missing required secret: $value"; exit 1; }
          done
          keychain="$RUNNER_TEMP/computer-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          umask 077
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/computer-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/computer-signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          python3 ../../scripts/sign-macos.py src-tauri/resources/driver --identity "$SIGNING_IDENTITY" --team "$TEAM_ID"
      - name: Build signed application
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.COMPUTER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.COMPUTER_UPDATER_PRIVATE_KEY_PASSWORD }}
          LONGX_COMPUTER_UPDATE_PUBLIC_KEY: ${{ vars.COMPUTER_UPDATER_PUBLIC_KEY }}
          LONGX_COMPUTER_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/computer-latest.json
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          if [[ "${{ steps.config.outputs.updater }}" == true ]]; then
            npm run build -- --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.release.conf.json
          else
            unset LONGX_COMPUTER_UPDATE_URL LONGX_COMPUTER_UPDATE_PUBLIC_KEY
            npm run build -- --bundles "${{ matrix.bundles }}"
          fi
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        env:
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          codesign --verify --deep --strict "src-tauri/target/release/bundle/macos/Longx Computer.app"
          codesign -dv --verbose=4 "src-tauri/target/release/bundle/macos/Longx Computer.app" 2>&1 | grep -F "TeamIdentifier=$TEAM_ID"
          xcrun stapler validate "src-tauri/target/release/bundle/macos/Longx Computer.app"
      - name: Package named release assets
        env:
          COMPUTER_TARGET: ${{ matrix.target }}
          COMPUTER_UPDATER_ENABLED: ${{ steps.config.outputs.updater }}
        run: node scripts/release-artifacts.mjs package
      - uses: actions/upload-artifact@v4
        with:
          name: computer-${{ matrix.target }}
          path: apps/computer/dist/*
          if-no-files-found: error
      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/computer-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/computer-signing.p12"

  publish:
    name: Publish desktop assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: computer-*
          path: apps/computer/dist
          merge-multiple: true
      - run: node apps/computer/scripts/release-artifacts.mjs manifest
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/computer/dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
